name: Flutter - Interviewace
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    step:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - name: Setup Flutter

        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.35.3'
      - name: Install dependencies
        run: flutter pub get
      - name: Build APK
        run: flutter build apk --release
        
